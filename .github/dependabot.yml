version: 2
# Grouped monthly updates (fleet template, owner decision 2026-11-21; same
# shape as pulseengine/rivet's .github/dependabot.yml).
# One entry per ecosystem, its directories in one `directories:` list, so a
# release opens one PR and not one per directory (#683 #687 #699 #701,
# #710-#715, #716-#719 each split one release into several PRs). Every entry
# runs monthly (the 1st, 02:00 UTC), keeps at most 2 PRs open, and waits 7
# days after a release (cooldown). Lockstep groups come first because
# Dependabot puts a dependency in the FIRST group it matches; then one
# minor-patch group. Majors stay ungrouped, one PR each, so a breaking change
# is read on its own. Security updates ignore the schedule and the limit.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    assignees:
      - "avrabe"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci-cd"
      - "automated"
    groups:
      github-actions-all:
        patterns:
          - "*"

  # /tools/checksum_updater, /tools/ssh_keygen and /tools/wasm_embed_aot feed
  # their Cargo.lock files to crate_universe (crate.from_cargo in MODULE.bazel),
  # so a lock bump there also changes MODULE.bazel.lock. Measured 2026-11-25 on
  # 76fbb63a: `cargo update -p anyhow --precise 1.0.105` in tools/ssh_keygen
  # made `bazel mod deps --lockfile_mode=error` exit 2. Dependabot cannot
  # regenerate MODULE.bazel.lock, so such a PR goes red on "Lockfiles and
  # advisories". Owner decision 2026-11-25: no App token; the lock step is
  # verify-only. On a stale lock that job runs .github/actions/lock-check-bazel
  # (copied from pulseengine/synth), which uploads the regenerated lock as the
  # module-bazel-lock artifact and prints the commands; an agent pushes the
  # lock as a signed commit to the Dependabot branch.
  - package-ecosystem: cargo
    directories:
      - /tools/checksum_updater_wasm
      - /tools-builder/toolchains
      - /tools/checksum_validator_multi/rust_validator
      - /examples/wac_remote_compose
      - /tools/checksum_updater
      - /tools/ssh_keygen
      - /tools/wasm_embed_aot
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    assignees:
      - "avrabe"
    commit-message:
      prefix: "rust"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
      - "automated"
    groups:
      # The wasm-tools family is version-locked: one release, one PR.
      wasm-tools-family:
        patterns:
          - "wasmparser"
          - "wasm-encoder"
          - "wasmprinter"
          - "wit-component"
          - "wit-parser"
          - "wasm-metadata"
          - "wat"
          - "walrus"
      wasmtime:
        patterns:
          - "wasmtime"
          - "wasmtime-*"
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directories:
      - /tools/http_downloader_go
      - /tools/checksum_validator_multi/go_downloader
      - /tools/checksum_validator_multi/production_checksum_updater
      - /examples/go_component
      - /examples/olareg_wasm
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    assignees:
      - "avrabe"
    commit-message:
      prefix: "go"
      include: "scope"
    labels:
      - "dependencies"
      - "tinygo"
      - "automated"
    # First run 2026-11-26 (Dependabot Updates run 45747344663) failed on:
    # - go.bytecodealliance.org/cm: "go_module_path_mismatch" (the vanity path
    #   resolves to the go.bytecodealliance.org repo root, not the cm module),
    #   in /examples/go_component. Bump it by hand with wit-bindgen-go.
    # - /examples/cpp_component/multi_component_system, no longer listed: its
    #   go.mod imports example.com/multi-component-system/... packages that
    #   only exist in the Bazel build, so `go mod tidy` cannot resolve them.
    ignore:
      - dependency-name: "go.bytecodealliance.org/cm"
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - /examples/js_component
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    assignees:
      - "avrabe"
    commit-message:
      prefix: "npm"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
      - "automated"
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
