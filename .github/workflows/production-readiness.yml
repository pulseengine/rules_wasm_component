name: Production Readiness

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Required checks must also report on merge-queue commits.
  merge_group:
  schedule:
    # Run daily to catch dependency issues
    - cron: "0 10 * * *"

jobs:
  smoke-tests-linux:
    name: Smoke Tests (linux)
    # On the self-hosted light pool (owner decision 2026-11-18); fork PRs fall
    # back to ubuntu-24.04. Split out of the matrix below because a
    # self-hosted label may not come from strategy.matrix (fork-guard checker).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned bazelisk into a job-local bin: no sudo, nothing left on the
      # persistent self-hosted host, checked against the sha256 digest GitHub
      # publishes for the v1.30.0 release asset.
      - name: Install bazelisk (pinned)
        env:
          BAZELISK_VERSION: v1.30.0
          BAZELISK_SHA256: a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/bazel" \
            "https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}/bazelisk-linux-amd64"
          echo "${BAZELISK_SHA256}  $RUNNER_TEMP/bin/bazel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/bazel"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build info
        run: bazel info

      - name: Run smoke tests
        run: bazel test //test/smoke:all --test_output=errors

      - name: Validate WebAssembly output
        run: |
          bazel build //examples/basic:hello_component
          find bazel-out/ -name "*.wasm" -type f | head -5

  smoke-tests:
    name: Smoke Tests
    # Stays on ${{ matrix.os }}: macOS needs a GitHub-hosted image.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Build info
        run: bazel info

      - name: Run smoke tests
        run: bazel test //test/smoke:all --test_output=errors

      - name: Validate WebAssembly output
        run: |
          bazel build //examples/basic:hello_component
          find bazel-out -name "*.wasm" -type f | head -5

  security-validation:
    name: Security Validation
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for placeholder checksums
        run: |
          if grep -r "1234567890abcdef" toolchains/; then
            echo "❌ Found placeholder checksums - security risk!"
            exit 1
          else
            echo "✅ No placeholder checksums found"
          fi

      - name: Validate checksum format
        run: |
          # Ensure all checksums are proper SHA256 (64 hex chars)
          # Look for hardcoded sha256 lines that don't contain exactly 64 hex characters
          # Exclude variable references like tool_info["sha256"] and platform_info["sha256"]
          if grep -rE '"sha256":\s*"[^"]*"' toolchains/ | grep -vE '"sha256":\s*"[a-f0-9]{64}"' | grep -v '# '; then
            echo "❌ Invalid checksum format found:"
            grep -rE '"sha256":\s*"[^"]*"' toolchains/ | grep -vE '"sha256":\s*"[a-f0-9]{64}"' | grep -v '# '
            echo ""
            echo "Found placeholder checksums that need real SHA256 values."
            echo "These placeholder patterns are security risks and must be replaced."
            exit 1
          else
            echo "✅ All checksums properly formatted"
          fi

  performance-benchmark:
    name: Performance Benchmark
    # Stays on ubuntu-24.04: Bazel not installed on smithy fleet.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Cold build benchmark
        run: |
          start_time=$(date +%s)
          bazel build //examples/basic:hello_component
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "Cold build time: ${duration}s"

          if [ $duration -gt 120 ]; then
            echo "⚠️ Cold build took longer than 2 minutes"
          else
            echo "✅ Cold build completed in reasonable time"
          fi

      - name: Incremental build benchmark
        run: |
          start_time=$(date +%s)
          bazel build //examples/basic:hello_component
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "Incremental build time: ${duration}s"

          if [ $duration -gt 10 ]; then
            echo "⚠️ Incremental build took longer than 10 seconds"
          else
            echo "✅ Incremental build fast"
          fi

  compatibility-matrix:
    name: Compatibility Tests (${{ matrix.name }})
    # Stays on ${{ matrix.os }}: the ubuntu:22.04 floor container runs on a hosted ubuntu-24.04 runner. Intel macOS dropped 2026-11-20 (owner decision).
    # The Linux floor is Ubuntu 22.04 / glibc 2.35 (rivet DD-004, REQ-005),
    # tested in an ubuntu:22.04 container: GitHub's ubuntu-22.04 runner image
    # is unsupported from 2027-04-17.
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - name: ubuntu-22.04
            os: ubuntu-24.04
            container: ubuntu:22.04

    steps:
      - name: Install base packages (container)
        if: matrix.container != ''
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 build-essential unzip zip xz-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assert the job runs on the Linux floor (DD-004)
        if: matrix.container != ''
        # rivet: verifies REQ-005
        # Fails unless the container's os-release is ubuntu 22.04; a dropped
        # `container:` line would otherwise test the 24.04 host. Its planted
        # control is ci-controls.toml "os-release-floor".
        run: grep -qx 'VERSION_ID="22.04"' /etc/os-release && grep -qx 'ID=ubuntu' /etc/os-release

      # setup-bazel configures bazelisk but relies on the copy preinstalled on
      # GitHub's runner images; the plain ubuntu:22.04 image has none.
      - name: Install bazelisk (container)
        if: matrix.container != ''
        env:
          BAZELISK_VERSION: v1.30.0
          BAZELISK_SHA256: a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8
        run: |
          curl -fsSL -o /usr/local/bin/bazel \
            "https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}/bazelisk-linux-amd64"
          echo "${BAZELISK_SHA256}  /usr/local/bin/bazel" | sha256sum -c -
          chmod +x /usr/local/bin/bazel

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true

      - name: Test basic functionality
        run: bazel test //test/smoke:all --test_output=summary

  production-readiness:
    name: Production Ready ✅
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    needs:
      [
        smoke-tests,
        smoke-tests-linux,
        security-validation,
        performance-benchmark,
        compatibility-matrix,
      ]
    if: always()

    steps:
      - name: Fail unless every needed job passed
        # A required check that is skipped counts as passing, so this job runs
        # always() and fails itself on any needed job that did not pass. The
        # block between the markers is run verbatim by ci-controls.toml
        # "aggregate-gate-*" against a planted failing result.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # aggregate-gate-begin
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "a needed job ended with: $r"; exit 1 ;;
            esac
          done
          echo "all needed jobs passed: $RESULTS"
          # aggregate-gate-end

      - name: Mark as production ready
        run: |
          echo "🎉 All production readiness checks passed!"
          echo "✅ Smoke tests: PASS"
          echo "✅ Security validation: PASS"
          echo "✅ Performance benchmarks: PASS"
          echo "✅ Compatibility matrix: PASS"
          echo ""
          echo "System is ready for production deployment! 🚀"
