name: Integration Examples Test

# Builds pulseengine/wasm-component-examples against this tree.
#
# "Direct Integration Test" is the gate: it runs on every PR and merge-queue
# commit (no paths filter, so it reports on docs-only PRs too) and checks out
# the examples repo at the commit pinned in .github/examples.ref. Only a PR
# here can change what it builds; bump the pin by PR to pick up new examples.
#
# "Integration (examples@main, early warning)" is not a gate: it builds the
# examples repo's main, or a branch there with the same name as this PR's
# branch (the breaking-change protocol below), and only warns.
#
# BREAKING CHANGE PROTOCOL:
# When introducing breaking changes, create a branch in the examples repo
# with the SAME NAME as your PR branch; the early-warning job tests against
# it. Then bump .github/examples.ref to the examples commit that works with
# the new API, in the same PR, so the gate tests it too.

on:
  pull_request:
    branches: [main]
  # Required checks must also report on merge-queue commits.
  merge_group:

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      examples_repo:
        description: 'Examples repository to test against'
        required: false
        default: 'pulseengine/wasm-component-examples'
        type: string

env:
  CI: true
  # The examples repository to trigger
  EXAMPLES_REPO: ${{ github.event.inputs.examples_repo || 'pulseengine/wasm-component-examples' }}
  # The examples repo has no .bazelversion; without this bazelisk takes the
  # newest Bazel release. Same version as ci.yml.
  USE_BAZEL_VERSION: 8.3.1

jobs:
  trigger-integration:
    name: Trigger Integration Tests
    if: github.event_name != 'merge_group'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}

    # This job requires a PAT with repo scope stored as INTEGRATION_TEST_TOKEN
    # If the secret is not configured, the job will be skipped gracefully
    steps:
      - name: Check for integration token
        id: check-token
        run: |
          if [ -z "${{ secrets.INTEGRATION_TEST_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "⚠️ INTEGRATION_TEST_TOKEN not configured - skipping integration tests"
            echo "To enable: Add a PAT with repo scope as INTEGRATION_TEST_TOKEN secret"
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger examples integration test
        if: steps.check-token.outputs.has_token == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.INTEGRATION_TEST_TOKEN }}
          repository: ${{ env.EXAMPLES_REPO }}
          event-type: test-integration
          client-payload: |
            {
              "ref": "${{ github.head_ref || github.ref_name }}",
              "repo": "${{ github.repository }}",
              "pr_number": "${{ github.event.pull_request.number }}",
              "sha": "${{ github.event.pull_request.head.sha || github.sha }}"
            }

      - name: Log integration test trigger
        if: steps.check-token.outputs.has_token == 'true'
        # The branch name reaches the shell through env, never interpolated
        # into the script: a branch name can contain $(...).
        env:
          RULES_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "✅ Triggered integration tests in ${{ env.EXAMPLES_REPO }}"
          echo ""
          echo "Test configuration:"
          echo "  Branch: $RULES_BRANCH"
          echo "  Repository: ${{ github.repository }}"
          echo "  PR: #${{ github.event.pull_request.number }}"
          echo "  SHA: ${{ github.event.pull_request.head.sha || github.sha }}"
          echo ""
          echo "View results: https://github.com/${{ env.EXAMPLES_REPO }}/actions"

  direct-integration-test:
    name: Direct Integration Test
    # On the self-hosted light pool (hosted ubuntu-24.04 queued 91-97 min on
    # 2026-11-25); fork PRs fall back to ubuntu-24.04.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      EXAMPLES_DIR: ${{ github.workspace }}/examples

    steps:
      - name: Checkout rules_wasm_component (this PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: rules_wasm_component

      - name: Read the pinned examples commit
        id: examples-ref
        working-directory: rules_wasm_component
        run: |
          REF=$(head -n 1 .github/examples.ref)
          if ! printf '%s\n' "$REF" | grep -Eqx '[0-9a-f]{40}'; then
            echo "FAIL: .github/examples.ref must hold one full commit sha, found: $REF"
            exit 1
          fi
          echo "Examples pinned at: $REF"
          echo "sha=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout examples repository (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pulseengine/wasm-component-examples
          ref: ${{ steps.examples-ref.outputs.sha }}
          path: examples

      # Pinned bazelisk into a job-local bin: no sudo, nothing left on the
      # persistent self-hosted host, checked against the sha256 digest GitHub
      # publishes for the v1.30.0 release asset.
      - name: Install bazelisk (pinned)
        env:
          BAZELISK_VERSION: v1.30.0
          BAZELISK_SHA256: a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/bazel" \
            "https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}/bazelisk-linux-amd64"
          echo "${BAZELISK_SHA256}  $RUNNER_TEMP/bin/bazel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/bazel"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Builds the examples with rules_wasm_component taken from the directory
      # this runs in (--override_module replaces the examples' git_override).
      # ci-controls.toml "examples-build-this-tree" runs the block verbatim on
      # a scratch copy of this tree with a planted defect.
      - name: Build examples against this tree
        working-directory: rules_wasm_component
        run: |
          # examples-build-begin
          set -eu
          RULES_DIR=$(pwd)
          cd "$EXAMPLES_DIR"
          # EXAMPLES_TARGETS may list several targets: split on purpose.
          # shellcheck disable=SC2086
          bazel build --override_module=rules_wasm_component="$RULES_DIR" ${EXAMPLES_TARGETS:-//...}
          # examples-build-end

      # rivet: verifies FEAT-008
      - name: Planted control (examples must be built from this tree)
        working-directory: rules_wasm_component
        env:
          EXAMPLES_TARGETS: //rust:hello_rust
        run: python3 .github/scripts/run_ci_controls.py --only examples-build-this-tree

      # Pinned download, sha256 from checksums/tools/wasmtime.json (#749).
      # wasmtime.dev/install.sh asked an unauthenticated GitHub API for the
      # latest version and, when rate limited, tried to fetch version "{".
      - name: Install Wasmtime (pinned, sha256-checked)
        working-directory: rules_wasm_component
        run: |
          # wasmtime-install-begin
          set -eu
          WASMTIME_VERSION=50.0.3
          SHA=$(jq -r --arg v "$WASMTIME_VERSION" '.versions[$v].platforms.linux_amd64.sha256' checksums/tools/wasmtime.json)
          ARCHIVE="wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$ARCHIVE" "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/$ARCHIVE"
          echo "$SHA  $RUNNER_TEMP/$ARCHIVE" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.wasmtime/bin"
          install -m 0755 "$RUNNER_TEMP/wasmtime-v${WASMTIME_VERSION}-x86_64-linux/wasmtime" "$HOME/.wasmtime/bin/wasmtime"
          "$HOME/.wasmtime/bin/wasmtime" --version
          # wasmtime-install-end
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Planted control (a wrong wasmtime sha256 must fail the install)
        working-directory: rules_wasm_component
        run: python3 .github/scripts/run_ci_controls.py --only wasmtime-install-wrong-sha

      - name: Test Rust components
        working-directory: examples
        run: |
          set -eu
          OVERRIDE="--override_module=rules_wasm_component=$GITHUB_WORKSPACE/rules_wasm_component"
          echo "=== Testing hello_rust ==="
          WASM_FILE=$(bazel cquery "$OVERRIDE" --output=files //rust:hello_rust 2>/dev/null | head -1)
          "$HOME/.wasmtime/bin/wasmtime" run "$WASM_FILE"

          echo ""
          echo "=== Testing calculator ==="
          WASM_FILE=$(bazel cquery "$OVERRIDE" --output=files //rust:calculator 2>/dev/null | head -1)
          OUTPUT=$("$HOME/.wasmtime/bin/wasmtime" run "$WASM_FILE" 8 + 8)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "8 + 8 = 16"

  examples-main-early-warning:
    name: Integration (examples@main, early warning)
    # Not a required check: the examples repo's main can change without a PR
    # here. Not run in the merge queue, where only the gate above matters.
    if: github.event_name != 'merge_group'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45

    steps:
      - name: Checkout rules_wasm_component (this PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: rules_wasm_component

      - name: Check for matching examples branch
        id: examples-branch
        # The branch name reaches the shell through env, never interpolated
        # into the script: a fork's branch name can contain $(...).
        env:
          RULES_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/pulseengine/wasm-component-examples.git "refs/heads/$RULES_BRANCH" >/dev/null; then
            echo "Found a matching examples branch; testing against it."
            echo "branch=$RULES_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "No matching examples branch; testing against main."
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout examples repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pulseengine/wasm-component-examples
          ref: ${{ steps.examples-branch.outputs.branch }}
          path: examples

      - name: Install bazelisk (pinned)
        env:
          BAZELISK_VERSION: v1.30.0
          BAZELISK_SHA256: a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/bazel" \
            "https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}/bazelisk-linux-amd64"
          echo "${BAZELISK_SHA256}  $RUNNER_TEMP/bin/bazel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/bazel"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build examples against this tree
        working-directory: examples
        run: bazel build --override_module=rules_wasm_component="$GITHUB_WORKSPACE/rules_wasm_component" //...

      - name: Report
        if: failure()
        run: |
          echo "The examples repo's main (or the same-name branch) does not build"
          echo "against this tree. Not a gate. If this PR breaks the examples API,"
          echo "add a same-name branch there and bump .github/examples.ref."
