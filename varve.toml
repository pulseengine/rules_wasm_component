# This is THE pin: what loom/meld/spar/synth/witness/wasm-tools/wkg/
# wit-bindgen-wrpc resolve to (see //varve/toolchains:BUILD.bazel), and —
# for a developer using varve's own shims outside Bazel — what their
# terminal resolves to too. One file, both worlds.
#
# `layer` resolves through the `covalent` realm (registry + trust root in
# //:covalent.pub, passed explicitly by //varve:varve.bzl — see that file's
# docstring), which COMPOSES the `pulseengine` and `pulseengine-wasm`
# realms into one pin. //:varve-realms.toml defines all three realms; it is
# what lets the composition walk resolve each one's own registry and root.
#
# wac stays OUT of `tools` in MODULE.bazel even though covalent carries it:
# the realm's only published wac (0.11.0) breaks WASI P3 async composition
# (toolchains/tool_versions.bzl pins wac at 0.9.0 for exactly that reason,
# issue #180). See //varve/toolchains:BUILD.bazel's docstring.
#
# To move to a newer layer: check what's actually published first
# (`crane ls ghcr.io/pulseengine/covalent-layers` or the GHCR package
# page), bump `layer` below, and send it through review like any other
# change — varve deliberately has no auto-update. Bumping this alone is
# the override; nothing else needs to change.
#
# 2026-09-07: the pulseengine realm's rolling trust root rotated (varve#110
# — the old root was a write-only CI secret with no recovery path). Not
# relevant to THIS pin directly (covalent has its own, un-rotated root),
# but it is why pulseengine's entry in varve-realms.toml is the NEW root,
# not the one most of pulseengine's history was signed with.
manifest-version = 1

[toolchain]
channel = "rolling"
layer   = "2026.10.0"
