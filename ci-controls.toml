# Planted controls: each CI check below is run against an input it must
# reject (pulseengine/plant manifest format). Run them with
#   python3 .github/scripts/run_ci_controls.py
# which runs every control in a scratch copy of the tree: the baseline (no
# plant) must pass, the planted overlay must fail.

# Run by the "Self-hosted fork guard" job.
[[control]]
id     = "fail-open-fork-guard"
check  = "Self-hosted fork guard"
run    = "python3 .github/scripts/check_selfhosted_fork_guard.py"
plant  = "ci-controls/fail-open-fork-guard"
expect = "fail"
stderr_or_stdout_matches = "a fork PR could reach"

# Run by the "Lint and Format Check" job (it has Bazel). The plant is a .bzl
# file with buildifier-visible formatting errors; the check must report it.
[[control]]
id     = "unformatted-starlark"
check  = "Lint and Format Check"
run    = "bazel --max_idle_secs=5 run //:buildifier_check"
plant  = "ci-controls/unformatted-starlark"
expect = "fail"
stderr_or_stdout_matches = "planted_unformatted.bzl # reformat"

# Run by the "Self-hosted fork guard" job (it has Python 3.11+ for this
# runner; the check itself is a grep). The assertion itself runs in "Compatibility Tests (ubuntu-22.04)"
# against the container's /etc/os-release; this control proves it rejects a
# 24.04 host (the container line dropped).
[[control]]
id     = "os-release-floor"
check  = "Compatibility Tests (ubuntu-22.04)"
run    = "grep -qx 'VERSION_ID=\"22.04\"' .github/scripts/testdata/os-release"
plant  = "ci-controls/os-release-floor"
expect = "fail"

# Run by the "Rivet validate" job, which installs a pinned rivet. The plant
# adds an artifact whose status rivet does not accept (the error that kept
# main red before #731); `rivet validate` must exit non-zero on it.
[[control]]
id     = "rivet-invalid-artifact"
check  = "Rivet validate"
run    = "rivet validate"
plant  = "ci-controls/rivet-invalid-artifact"
expect = "fail"
stderr_or_stdout_matches = "LS-099"

# Run by "Test on ubuntu-24.04" after its tests (that job has Bazel and a warm
# disk cache). The plant adopts an empty core wasm module in place of the
# component; component_import_test (wit_from_component, FEAT-003) must fail.
[[control]]
id     = "component-import-core-module"
check  = "Test on ubuntu-24.04"
run    = "bazel --max_idle_secs=5 test --disk_cache=~/.cache/rwc-disk-cache --test_output=errors //examples/component_import_example:component_import_test"
plant  = "ci-controls/component-import-core-module"
expect = "fail"
stderr_or_stdout_matches = "input is a core wasm module"

# Run by "Test on ubuntu-24.04". The plant points varve's loom toolchain at
# the per-tool fallback binary; varve_resolution_test (FEAT-004) must fail.
[[control]]
id     = "varve-fallback-wins"
check  = "Test on ubuntu-24.04"
run    = "bazel --max_idle_secs=5 test --disk_cache=~/.cache/rwc-disk-cache --test_output=errors //test/varve:varve_resolution_test"
plant  = "ci-controls/varve-fallback-wins"
expect = "fail"
stderr_or_stdout_matches = "loom_toolchain_type.loom resolved to"

# Run by "Test on ubuntu-24.04". The plant builds the file_ops integration
# test's workspace with a misspelled operation type; the file_ops wrapper must
# fail the action instead of skipping the operation (#775).
[[control]]
id     = "file-ops-unknown-op"
check  = "Test on ubuntu-24.04"
run    = "bazel --max_idle_secs=5 test --disk_cache=~/.cache/rwc-disk-cache --test_output=errors //test/file_ops_integration:embedded_implementation_test"
plant  = "ci-controls/file-ops-unknown-op"
expect = "fail"
stderr_or_stdout_matches = "Unknown operation type: copy_files"

# Run by the "Self-hosted fork guard" job. Runs the aggregate-gate block of
# "Production Ready ✅" (extracted verbatim from production-readiness.yml) on the job results in
# .github/scripts/testdata/needs-results; the plant adds a failed job.
[[control]]
id     = "aggregate-gate-production"
check  = "Production Ready ✅"
run    = "sh -c 'RESULTS=\"$(cat .github/scripts/testdata/needs-results)\" sh -c \"$(sed -n \"/# aggregate-gate-begin/,/# aggregate-gate-end/p\" .github/workflows/production-readiness.yml)\"'"
plant  = "ci-controls/aggregate-gate"
expect = "fail"
stderr_or_stdout_matches = "FAILED: a needed job ended with: failure"

# Run by the "Self-hosted fork guard" job. Runs the aggregate-gate block of
# "BCR Test Summary" (extracted verbatim from bcr-compatibility.yml) on the job results in
# .github/scripts/testdata/needs-results; the plant adds a failed job.
[[control]]
id     = "aggregate-gate-bcr"
check  = "BCR Test Summary"
run    = "sh -c 'RESULTS=\"$(cat .github/scripts/testdata/needs-results)\" sh -c \"$(sed -n \"/# aggregate-gate-begin/,/# aggregate-gate-end/p\" .github/workflows/bcr-compatibility.yml)\"'"
plant  = "ci-controls/aggregate-gate"
expect = "fail"
stderr_or_stdout_matches = "FAILED: a needed job ended with: failure"

# Run by "Test on ubuntu-24.04". The plant verifies a copy of the attested
# greeter whose content was changed after attestation (wasm-tools metadata
# add); wasm_verify_chain (wsc verify-chain, >= 0.12.2, sigil#395) must fail.
[[control]]
id     = "wsc-verify-chain-tamper"
check  = "Test on ubuntu-24.04"
run    = "bazel --max_idle_secs=5 build --disk_cache=~/.cache/rwc-disk-cache //examples/pipeline_attestation:greeter_chain_verified"
plant  = "ci-controls/wsc-verify-chain-tamper"
expect = "fail"
stderr_or_stdout_matches = "content changed after attestation"

# Run by "Direct Integration Test" (Integration Examples workflow), which
# runs the install snippet itself. The plant replaces the wasmtime 50.0.3
# linux_amd64 sha256 with zeros; the pinned install must refuse the archive.
[[control]]
id     = "wasmtime-install-wrong-sha"
check  = "Direct Integration Test"
run    = "sh -c 'sh -c \"$(sed -n \"/# wasmtime-install-begin/,/# wasmtime-install-end/p\" .github/workflows/integration-examples.yml)\"'"
plant  = "ci-controls/wasmtime-install-wrong-sha"
expect = "fail"
stderr_or_stdout_matches = "FAILED"

# Run by "Direct Integration Test" (Integration Examples workflow), which
# runs the examples build block itself with EXAMPLES_DIR set to its examples
# checkout. The plant is a REPO.bazel that fails every package of this tree:
# the examples build must break, proving it used this tree and not the
# examples' own git_override of rules_wasm_component.
[[control]]
id     = "examples-build-this-tree"
check  = "Direct Integration Test"
run    = "sh -c 'sh -c \"$(sed -n \"/# examples-build-begin/,/# examples-build-end/p\" .github/workflows/integration-examples.yml)\"'"
plant  = "ci-controls/examples-build-this-tree"
expect = "fail"
stderr_or_stdout_matches = "planted: rules_wasm_component taken from this tree"

# Run by "Test on ubuntu-24.04". The plant points the sample test at a reactor
# component built by rustc 1.97.0; the Rust 1.100 shape assertion must fail.
[[control]]
id     = "rust-1100-component-shape"
check  = "Test on ubuntu-24.04"
run    = "bazel --max_idle_secs=5 test --disk_cache=~/.cache/rwc-disk-cache --test_output=errors --test_arg=--exact --test_arg=sample_has_rust_1100_wasip2_shape //test/rust_1100:sample_test"
plant  = "ci-controls/rust-1100-component-shape"
expect = "fail"
stderr_or_stdout_matches = "wit-component-fixup does not run an imported _initialize"

# Run by "Test on ubuntu-24.04". The plant runs the Rust 1.100 sample on
# wasmtime 45.0.1, which must fail to link exit-with-code (ordeal#309).
[[control]]
id     = "wasmtime-pre46-rejects-1100"
check  = "Test on ubuntu-24.04"
run    = "bazel --max_idle_secs=5 test --disk_cache=~/.cache/rwc-disk-cache --test_output=errors --test_arg=--exact --test_arg=sample_runs_on_wasmtime //test/rust_1100:sample_test"
plant  = "ci-controls/wasmtime-pre46-rejects-1100"
expect = "fail"
stderr_or_stdout_matches = "instance export `exit-with-code` has the wrong type"

# The four controls below are run by "Lockfiles and advisories". The cargo
# ones run the job's lockfile-check snippet itself (markers in ci.yml).

# The plant adds a dependency to rust_validator's Cargo.toml without
# updating its Cargo.lock.
[[control]]
id     = "stale-cargo-lock"
check  = "Lockfiles and advisories"
run    = "sh -c 'sh -c \"$(sed -n \"/# lockfile-check-begin/,/# lockfile-check-end/p\" .github/workflows/ci.yml)\"'"
plant  = "ci-controls/stale-cargo-lock"
expect = "fail"
stderr_or_stdout_matches = "rust_validator/Cargo.lock is stale"

# The plant adds tools/planted_vulnerable with a consistent Cargo.lock that
# pins url 2.5.8 (RUSTSEC-2026-0592).
[[control]]
id     = "nested-vulnerable-lock"
check  = "Lockfiles and advisories"
run    = "sh -c 'sh -c \"$(sed -n \"/# lockfile-check-begin/,/# lockfile-check-end/p\" .github/workflows/ci.yml)\"'"
plant  = "ci-controls/nested-vulnerable-lock"
expect = "fail"
stderr_or_stdout_matches = "unignored vulnerability in ./tools/planted_vulnerable/Cargo.lock"

# The plant moves the ssh_keygen advisory ignores' expiry into the past.
[[control]]
id     = "expired-audit-ignore"
check  = "Lockfiles and advisories"
run    = "sh -c 'sh -c \"$(sed -n \"/# lockfile-check-begin/,/# lockfile-check-end/p\" .github/workflows/ci.yml)\"'"
plant  = "ci-controls/expired-audit-ignore"
expect = "fail"
stderr_or_stdout_matches = "tools/ssh_keygen/.cargo/audit.toml have expired"

# The plant appends a comment to toolchains/tool_versions.bzl, which changes
# the bzlTransitiveDigest MODULE.bazel.lock records for the extensions that
# load it. If the real file changes later, the plant still differs from it.
[[control]]
id     = "stale-bazel-lock"
check  = "Lockfiles and advisories"
run    = "bazel --max_idle_secs=5 mod deps --lockfile_mode=error"
plant  = "ci-controls/stale-bazel-lock"
expect = "fail"
stderr_or_stdout_matches = "MODULE.bazel.lock is no longer up-to-date"

# Run by the "Self-hosted fork guard" job, like the two aggregate-gate
# controls above. The plant's needs-results holds a cancelled job (a hosted
# runner that was never acquired); the gate must fail it as INCOMPLETE, never
# pass it.
[[control]]
id     = "aggregate-gate-production-cancelled"
check  = "Production Ready ✅"
run    = "sh -c 'RESULTS=\"$(cat .github/scripts/testdata/needs-results)\" sh -c \"$(sed -n \"/# aggregate-gate-begin/,/# aggregate-gate-end/p\" .github/workflows/production-readiness.yml)\"'"
plant  = "ci-controls/aggregate-gate-cancelled"
expect = "fail"
stderr_or_stdout_matches = "INCOMPLETE: a needed job was cancelled"

[[control]]
id     = "aggregate-gate-bcr-cancelled"
check  = "BCR Test Summary"
run    = "sh -c 'RESULTS=\"$(cat .github/scripts/testdata/needs-results)\" sh -c \"$(sed -n \"/# aggregate-gate-begin/,/# aggregate-gate-end/p\" .github/workflows/bcr-compatibility.yml)\"'"
plant  = "ci-controls/aggregate-gate-cancelled"
expect = "fail"
stderr_or_stdout_matches = "INCOMPLETE: a needed job was cancelled"

# Run by "Test on ubuntu-24.04". The @crates hub's wit-bindgen must carry the
# `async-spawn` feature (relay's p3 stream loops spawn tasks); the plant puts back
# the manifest and lock without it, so wit_bindgen::spawn_local is missing.
[[control]]
id     = "no-async-spawn"
check  = "Test on ubuntu-24.04"
run    = "bazel --max_idle_secs=5 test --disk_cache=~/.cache/rwc-disk-cache --test_output=errors //test/p3:p3_spawn_build_test"
plant  = "ci-controls/no-async-spawn"
expect = "fail"
stderr_or_stdout_matches = "spawn_local"
